name: Sign macOS release package

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    environment: macos-release
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Find the successful build for this commit
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow macos.yml \
            --branch main --commit "$GITHUB_SHA" --event push --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [[ ! "$run_id" =~ ^[0-9]+$ ]]; then
            echo "The macOS build and test workflow must pass on this main commit." >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: KookieClock-macos-universal
          path: artifacts/macos-release
          run-id: ${{ steps.build.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Sign and notarize the universal app
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_ID: ${{ secrets.APPLE_NOTARY_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${MACOS_CERTIFICATE_P12:?Add the Developer ID certificate to the macos-release environment}"
          : "${MACOS_CERTIFICATE_PASSWORD:?Add the password used to export the certificate}"
          : "${APPLE_NOTARY_ID:?Add the Apple Account email used for notarization}"
          : "${APPLE_TEAM_ID:?Add the Apple Developer Team ID}"
          : "${APPLE_NOTARY_PASSWORD:?Add the Apple app-specific password}"
          scratch="$(mktemp -d "$RUNNER_TEMP/kookieclock-sign.XXXXXX")"
          keychain="$scratch/signing.keychain-db"
          trap 'security delete-keychain "$keychain" 2>/dev/null || true; rm -rf "$scratch"' EXIT
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 -D > "$scratch/developer-id.p12"
          security import "$scratch/developer-id.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          identity="$(security find-identity -v -p codesigning "$keychain" | awk -v team="$APPLE_TEAM_ID" \
            '/"Developer ID Application:/ && index($0, "(" team ")") {print $2; exit}')"
          if [[ -z "$identity" ]]; then
            echo "A valid Developer ID Application signing identity for the configured team was not found." >&2
            exit 1
          fi
          ditto -x -k artifacts/macos-release/KookieClock-macos-universal.zip "$scratch/app"
          app="$scratch/app/KookieClock.app"
          binary="$app/Contents/MacOS/KookieClock"
          lipo "$binary" -verify_arch arm64 x86_64
          codesign --force --options runtime --timestamp --keychain "$keychain" --sign "$identity" "$app"
          codesign --verify --strict --verbose=2 "$app"
          ditto -c -k --keepParent "$app" "$scratch/submission.zip"
          notary_auth=(--apple-id "$APPLE_NOTARY_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_NOTARY_PASSWORD")
          xcrun notarytool submit "$scratch/submission.zip" "${notary_auth[@]}" \
            --wait --timeout 30m --output-format json > "$scratch/notary.json" || true
          cat "$scratch/notary.json"
          submission_id="$(jq -r '.id // empty' "$scratch/notary.json")"
          if [[ -n "$submission_id" ]]; then
            xcrun notarytool log "$submission_id" "${notary_auth[@]}"
          fi
          jq -e '.status == "Accepted"' "$scratch/notary.json" >/dev/null
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"
          mkdir -p dist/macos-signed
          ditto -c -k --keepParent "$app" dist/macos-signed/KookieClock-macos-universal.zip
          (
            cd dist/macos-signed
            shasum -a 256 KookieClock-macos-universal.zip > SHA256SUMS.txt
          )
      - name: Smoke test the signed ZIP
        timeout-minutes: 2
        run: |
          mkdir -p artifacts/macos-signed-smoke
          cd artifacts/macos-signed-smoke
          ditto -x -k ../../dist/macos-signed/KookieClock-macos-universal.zip .
          codesign --verify --strict KookieClock.app
          xcrun stapler validate KookieClock.app
          ./KookieClock.app/Contents/MacOS/KookieClock --smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: KookieClock-macos-signed
          path: dist/macos-signed/
          if-no-files-found: error
